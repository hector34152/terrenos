<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6 select-none font-sans overflow-hidden relative">

    <!-- Elementos decorativos de fondo (Glows/Luces) -->
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-fuchsia-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Contenedor Principal -->
    <div class="max-w-md w-full text-center relative z-10 backdrop-blur-sm bg-slate-800/40 p-8 md:p-10 rounded-3xl border border-slate-700/50 shadow-2xl shadow-indigo-500/10">
        
        <!-- Ilus/Icono animado -->
        <div class="relative w-32 h-32 mx-auto mb-6 flex items-center justify-center">
            <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500 to-fuchsia-500 rounded-full animate-pulse opacity-30 blur-md"></div>
            <div class="relative bg-slate-800 border border-slate-700 w-28 h-28 rounded-full flex items-center justify-center text-indigo-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-14 h-14 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
            </div>
        </div>

        <!-- Código de Error -->
        <h1 class="text-7xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-fuchsia-400 to-pink-400 mb-2">
            404
        </h1>

        <!-- Mensajes -->
        <h2 class="text-2xl font-bold text-white mb-3">
            ¡Sitio temporalmente no disponible!
        </h2>

        <!-- Footer / Nota Temporal -->
        <div class="mt-8 pt-6 border-t border-slate-700/40 text-xs text-slate-500">
            Sitio web temporal &bull; Volveremos pronto
        </div>
    </div>

</body>
</html>
